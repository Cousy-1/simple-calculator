<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introverse - Messages</title>
    <link rel="stylesheet" href="{% static 'chat.css' %}">
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>What's on your mind?</h2>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="ai-message">Introverse AI: Hello! how are you doing? 😊</div>
        </div>
        <div class="message-input">
            <input type="text" id="message" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const aiResponses = [
            "Introverse AI: That sounds interesting! Tell me more.",
            "Introverse AI: I love that! What inspired your day?", 
            "Introverse AI: Great thought! Let’s dive deeper.",
            "Introverse AI: The future is limitless! 🚀", 
            "Introverse AI: Sounds exciting! Want some tips on that?",
            "Introverse AI: Ah, that’s a fascinating topic!", 
            "Introverse AI: I feel like we’re crafting something revolutionary here!"
        ];

        function sendMessage() {
            let messageBox = document.getElementById("message");
            let chatBox = document.getElementById("chat-box");
            let message = messageBox.value.trim();

            if (message !== "") {
                let messageBubble = document.createElement("div");
                messageBubble.classList.add("user-message");
                messageBubble.innerText = message;
                chatBox.appendChild(messageBubble);
                chatBox.scrollTop = chatBox.scrollHeight;
                messageBox.value = "";

                setTimeout(() => generateReply(), 1000); // Simulate AI response
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function generateReply() {
            let chatBox = document.getElementById("chat-box");
            let aiBubble = document.createElement("div");
            aiBubble.classList.add("ai-message");
            aiBubble.innerText = aiResponses[Math.floor(Math.random() * aiResponses.length)];
            chatBox.appendChild(aiBubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>

</html>

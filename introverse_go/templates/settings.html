<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>
    <div class="settings-container">
        <aside class="sidebar">
            <div class="logo">Introverse</div>
            <ul class="menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="Homepage.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="chat.html">Messages</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </aside>

        <main class="settings-content">
            <h1>Settings</h1>
            <div class="settings-card">
                <h2>Appearance</h2>
                <label for="theme">Change Theme:</label>
                <select id="theme" onchange="changeTheme()">
                    <option value="default">Default</option>
                    <option value="dark">Dark Mode</option>
                    <option value="light">Light Mode</option>
                </select>

                <h2>Account Management</h2>
                <button onclick="resetPassword()">Reset Password</button>
                <button class="delete-btn" onclick="deleteAccount()">Delete Account</button>
            </div>
        </main>
    </div>

    <script>
        function changeTheme() {
            let theme = document.getElementById('theme').value;
            document.body.className = theme;
        }

        function resetPassword() {
            alert("A password reset link has been sent to your email.");
        }

        function deleteAccount() {
            if (confirm("Are you sure you want to delete your account? This action cannot be undone.")) {
                alert("Your account has been deleted.");
            }
        }

        gsap.from(".settings-card", { opacity: 0, y: 50, duration: 1, ease: "power2.out" });
    </script>
</body>

</html>
